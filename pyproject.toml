# Generated with zope.meta (https://zopemeta.readthedocs.io/) from:
# https://github.com/zopefoundation/meta/tree/master/src/zope/meta/zope-product
[build-system]
requires = [
    "setuptools >= 78.1.1,< 82",
    "wheel",
]
build-backend = "setuptools.build_meta"


[project]
name = "five.formlib"
version = "5.1.dev0"
description = "zope.formlib integration for Zope."
license = "ZPL-2.1"
classifiers = [
    "Development Status :: 6 - Mature",
    "Environment :: Web Environment",
    "Framework :: Zope :: 5",
    "Framework :: Zope :: 6",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Topic :: Internet :: WWW/HTTP :: WSGI :: Application",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dynamic = ["readme"]
requires-python = ">=3.11"
authors = [
    {name = "Zope Foundation",email = "zope-dev@zope.dev"},
]
maintainers = [
    {name = "Plone Foundation and contributors",email = "zope-dev@zope.dev"},
]
dependencies = [
    "transaction",
    "zope.app.form",
    "zope.browser",
    "zope.browsermenu",
    "zope.component",
    "zope.event",
    "zope.formlib>=4.4",
    "zope.i18nmessageid",
    "zope.interface",
    "zope.lifecycleevent",
    "zope.location",
    "zope.publisher",
    "zope.schema",
    "ExtensionClass",
    "Zope >= 4",
]
keywords = ["zope", "zope5", "five", "formlib"]

[project.urls]
Source = "https://github.com/zopefoundation/five.formlib"
Issues = "https://github.com/zopefoundation/five.formlib/issues"
Changelog = "https://raw.githubusercontent.com/zopefoundation/five.formlib/master/CHANGES.rst"

[tool.coverage.run]
branch = true
source = ["five.formlib"]

[tool.coverage.report]
fail_under = 82
precision = 2
ignore_errors = true
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "pragma: nocover",
    "except ImportError:",
    "raise NotImplementedError",
    "if __name__ == '__main__':",
    "self.fail",
    "raise AssertionError",
    "raise unittest.Skip",
]

[tool.coverage.html]
directory = "parts/htmlcov"

[tool.setuptools.dynamic]
readme = {file = ["README.rst", "CHANGES.rst"]}
