# Generated with zope.meta (https://zopemeta.readthedocs.io/) from:
# https://github.com/zopefoundation/meta/tree/master/src/zope/meta/zope-product
[meta]
template = "zope-product"
commit-id = "76e81852"

[python]
with-pypy = false
with-sphinx-doctests = false
with-windows = false
with-future-python = false
with-macos = false
with-docs = false

[coverage]
fail-under = 82

[isort]
known_zope = "AccessControl, Products.Five, Testing, ZPublisher"

[manifest]
additional-rules = [
    "recursive-include src *.po",
    "recursive-include src *.pot",
    "recursive-include src *.pt",
    "recursive-include src *.txt",
    "recursive-include src *.zcml",
]

[check-manifest]
ignore-bad-ideas = ["src/five/formlib/tests/locales/de/LC_MESSAGES/formtest.mo"]
